# Read by SonarQube for IDE (SonarLint) even without a connected server, and by sonar-scanner
# if this project is ever connected to a SonarQube/SonarCloud server. Keeps generated build
# output out of analysis scope -- without this, a scan picks up Gradle's own generated
# test-report/problems-report HTML/CSS/JS under backend/build/reports/ as if it were real
# source (73 of 81 findings in .sonar_report/sonar-report-2026-09-28.md were exactly this).
sonar.exclusions=backend/build/**,frontend/dist/**,frontend/node_modules/**
