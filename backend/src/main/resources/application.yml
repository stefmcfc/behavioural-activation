server:
  port: ${SERVER_PORT:8420}
  servlet:
    session:
      # PLANNER-016-AC-01/AC-02: unchanged default (30 minutes, matching Spring Boot's own
      # untouched default), now tunable via SESSION_TIMEOUT without a code change.
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        # PLANNER-001-AC-15: CSRF is disabled (see the spec's Non-functional notes), so this is the
        # practical CSRF defense for the session cookie, alongside the CORS allow-list.
        same-site: lax

spring:
  application:
    name: behaviouralactivation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/behaviouralactivation}
    username: ${DB_USERNAME:behaviouralactivation}
    password: ${DB_PASSWORD:behaviouralactivation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: http://localhost:4321
  bootstrap:
    username: ${APP_BOOTSTRAP_USERNAME:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
